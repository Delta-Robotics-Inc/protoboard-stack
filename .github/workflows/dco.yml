# The Developer Certificate of Origin (CONTRIBUTING.md, "Sign your work"):
# every commit of a pull request is signed off by its author. Merge commits
# and GitHub's bots (Dependabot) are not checked. Make it a required check in
# main's branch protection, with CI's jobs.
name: DCO

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: Every commit is signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # the pull request's commits, back to its base
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Signed-off-by on each commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/dco.mjs "$BASE" "$HEAD"
