# The workspace the stack builds in, shared by ci.yml and release.yml: this
# repository checked out as protoboard-stack/ (the caller's first step), with
# UHD (Delta-Robotics-Inc/uhd) and the UHD viewer (Delta-Robotics-Inc/uhd-viewer)
# beside it, both public and each at a pinned release tag. The root
# package.json links them as ../uhd and ../uhd-viewer.
#
# Each sibling is installed and built, then the stack and the VS Code
# extension are installed (npm ci). The checkouts keep no credentials.
#
# To move to a newer UHD or viewer: change the default below (one place for
# both workflows); the check step says when a tag does not satisfy what the
# stack's packages ask for.
name: Stack workspace
description: UHD and the UHD viewer beside this repository at pinned tags, built; the stack and the extension installed

inputs:
  uhd-ref:
    description: The Delta-Robotics-Inc/uhd tag (or commit) to build against
    default: v0.3.0
  uhd-viewer-ref:
    description: The Delta-Robotics-Inc/uhd-viewer tag (or commit) to build against
    # the hierarchy's own fold and reopen buttons (PB-1070, PB-1119; uhd-viewer#8), until uhd-viewer v0.2.1 is tagged: then v0.2.1
    default: 1c31ab381f73c803466448bab51dc133d97ce9f0

runs:
  using: composite
  steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.1
      with:
        repository: Delta-Robotics-Inc/uhd
        ref: ${{ inputs.uhd-ref }}
        path: uhd
        persist-credentials: false

    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.1
      with:
        repository: Delta-Robotics-Inc/uhd-viewer
        ref: ${{ inputs.uhd-viewer-ref }}
        path: uhd-viewer
        persist-credentials: false

    # The cloud client is a package of this repository (PB-1047, step 3): nothing may link a checkout that a
    # public clone does not have.
    - name: The stack links only public checkouts
      shell: bash
      working-directory: protoboard-stack
      run: |
        if grep -n 'protoboard-cloud' package.json; then
          echo "::error title=package.json links protoboard-cloud::The root package.json links ../protoboard-cloud, which is private and not checked out here. The cloud client must be a package of this repository (packages/cloud) before CI can install the stack."
          exit 1
        fi

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          uhd/package-lock.json
          uhd-viewer/package-lock.json
          protoboard-stack/package-lock.json
          protoboard-stack/packages/vscode-protoboard/package-lock.json

    - name: uhd (install, build)
      shell: bash
      working-directory: uhd
      run: npm ci --no-audit --no-fund && npm run build
    - name: uhd-viewer (install, build)
      shell: bash
      working-directory: uhd-viewer
      run: npm ci --no-audit --no-fund && npm run build
    - name: The stack (install; builds the web viewer)
      shell: bash
      working-directory: protoboard-stack
      run: npm ci --no-audit --no-fund
    - name: The VS Code extension (install)
      shell: bash
      working-directory: protoboard-stack/packages/vscode-protoboard
      run: npm ci --no-audit --no-fund

    - name: The UHD and viewer tags satisfy the stack's packages
      shell: bash
      working-directory: protoboard-stack
      run: node --import tsx .github/scripts/siblings.mjs
