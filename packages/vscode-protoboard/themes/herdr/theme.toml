# Protoboard Dark and Light: generated by `npm run themes` in protoboard-stack/packages/vscode-protoboard from the Protoboard VS Code themes; edit src/themeColors.ts there, not this file
[theme]
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

[theme.custom.dark]
panel_bg = "#1f1f1f"
sidebar_bg = "#1a1a1a"
active_row_bg = "#404040"
selection_bg = "#5a2c13"
surface0 = "#353535"
surface1 = "#404040"
surface_dim = "#2a2a2a"
overlay0 = "#686868"
overlay1 = "#989898"
subtext0 = "#b9b9b9"
text = "#d9d9d9"
accent = "#ff5c00"
peach = "#ff5c00"
red = "#ef4444"
green = "#4ade80"
yellow = "#facc15"
blue = "#60a5fa"
teal = "#22d3ee"
mauve = "#c084fc"

[theme.custom.light]
panel_bg = "#eaeaea"
sidebar_bg = "#f0f0f0"
active_row_bg = "#c0c0c0"
selection_bg = "#f3d2c0"
surface0 = "#d0d0d0"
surface1 = "#c0c0c0"
surface_dim = "#dedede"
overlay0 = "#919191"
overlay1 = "#555555"
subtext0 = "#444444"
text = "#333333"
accent = "#d04400"
peach = "#d04400"
red = "#ef4444"
green = "#16a34a"
yellow = "#a16207"
blue = "#2563eb"
teal = "#0891b2"
mauve = "#9333ea"
