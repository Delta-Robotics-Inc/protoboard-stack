# Subsystems the board's devices need (Zephyr 4.2.0); each driver turns itself on when its devicetree node is enabled.
# Add with -DEXTRA_CONF_FILE=firmware.conf. Generated by @protoboardai/ext-zephyr. Do not edit.
# WARNING: u2 (adi-max30102efd): no Zephyr driver in this provider's table; its node has no compatible, so the application finds it by the label u2 and drives it itself
# WARNING: m1 (fx-gnss-uart) on uart0: no Zephyr driver in this provider's table; the application talks to uart0 directly

# buttons (gpio-keys)
CONFIG_INPUT=y
# I2C buses
CONFIG_I2C=y
# fuel gauge driver
CONFIG_FUEL_GAUGE=y
# haptic driver
CONFIG_HAPTICS=y
# SPI buses
CONFIG_SPI=y
# display driver
CONFIG_DISPLAY=y
# UARTs
CONFIG_SERIAL=y
# USB device stack
CONFIG_USB_DEVICE_STACK_NEXT=y
